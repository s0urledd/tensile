# docker compose -f deploy/docker-compose.yml up -d --build
# Settings come from deploy/.env (copy observer.env.example). RPC must be
# reachable from inside the containers: a node on the host is
# http://host.docker.internal:26657 (add extra_hosts on Linux) or its LAN
# address, never 127.0.0.1. POLICY stays empty: the prober then reveals
# no sampling day secret (deploy/README.md, 3).
services:
  scan:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["sentinel-scan", "-rpc", "${RPC}", "-data-dir", "/data", "-start-height", "${START_HEIGHT:-0}", "-skip-heights=${SKIP_HEIGHTS:-}", "-follow"]
    volumes: ["observer-data:/data"]
    restart: unless-stopped
  probe:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["sentinel-probe", "-rpc", "${RPC}", "-data-dir", "/data", "-vantage", "${VANTAGE}", "-policy", "${POLICY:-}"]
    volumes: ["observer-data:/data"]
    restart: unless-stopped
  heartbeat:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["observer-heartbeat", "-rpc", "${RPC}", "-data-dir", "/data", "-vantage", "${VANTAGE}", "-interval", "5m"]
    volumes: ["observer-data:/data"]
    restart: unless-stopped
  collector:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["observer-collector", "-rpc", "${RPC}", "-data-dir", "/data", "-vantage", "${VANTAGE}"]
    volumes: ["observer-data:/data"]
    restart: unless-stopped
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["observer-api", "-data-dir", "/data", "-listen", "0.0.0.0:8080", "-vantage", "${VANTAGE}",
              "-vantage-location", "${VANTAGE_LOCATION:-}", "-vantage-provider", "${VANTAGE_PROVIDER:-}",
              "-publishers", "${PUBLISHERS:-/etc/fibre-observer/publishers.yaml}"]
    volumes: ["observer-data:/data"]
    depends_on: [collector]
    healthcheck:
      test: ["CMD", "observer-api", "-check", "http://127.0.0.1:8080/v1/meta"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - site:/var/www/fibre-observer:ro
      - caddy-data:/data
    environment: ["DOMAIN=${DOMAIN}"]
    depends_on:
      api: { condition: service_healthy }
      site-copy: { condition: service_completed_successfully }
    restart: unless-stopped
  # copies the built site out of the image into the shared volume once
  site-copy:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["sh", "-c", "cp -r /var/www/fibre-observer/. /site/"]
    volumes: ["site:/site"]
    restart: "no"

volumes:
  observer-data:
  site:
  caddy-data:
