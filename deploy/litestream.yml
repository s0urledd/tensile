# Copy to /etc/fibre-observer/litestream-<network>.yml (one per instance)
# and change BOTH lines marked <network> below to that network: the database
# it replicates and its path in the bucket. Changing only the first sends
# mainnet's database to mocha/observer.db. Then enable
# fibre-litestream@<network>, which runs
# `litestream replicate -config /etc/fibre-observer/litestream-<network>.yml`.
#
# This replicates the DERIVED database only. The JSONL files in the same
# directory are the record the database is rebuilt from, and litestream does
# not copy them: back them up separately (rsync/restic) or accept that a lost
# disk costs the raw evidence. Restoring: stop fibre-collector AND fibre-api
# (both hold the WAL) before `litestream restore`.
dbs:
  - path: /var/lib/fibre-observer/mocha/observer.db   # <network>
    replicas:
      - type: s3
        bucket: fibre-observer-backup
        path: mocha/observer.db                        # <network>
        endpoint: https://<account>.r2.cloudflarestorage.com
        region: auto
        # access keys via LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY
        sync-interval: 1s
        retention: 72h
        snapshot-interval: 24h
