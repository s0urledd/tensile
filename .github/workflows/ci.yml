name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: gofmt -l
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

  # ---- zero-dependency modules: fast, standalone, race-checked ----
  fibre-tlsverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fibre-tlsverify/go.mod
          cache-dependency-path: fibre-tlsverify/go.sum
      - name: vet
        working-directory: fibre-tlsverify
        run: go vet ./...
      - name: test (with -race)
        working-directory: fibre-tlsverify
        run: go test -race -shuffle=on ./...

  fibre-assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fibre-assign/go.mod
          cache-dependency-path: fibre-assign/go.sum
      - name: vet
        working-directory: fibre-assign
        run: go vet ./...
      - name: test (with -race)
        working-directory: fibre-assign
        run: go test -race -shuffle=on ./...

  # ---- differential test: builds celestia-app from the module proxy ----
  fibre-assign-reftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fibre-assign/reftest/go.mod
          cache-dependency-path: fibre-assign/reftest/go.sum
      - name: differential test vs celestia-app
        working-directory: fibre-assign/reftest
        run: go test -shuffle=on ./...

  # ---- the Sentinel: scanner + prober ----
  fibre-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fibre-sentinel/go.mod
          cache-dependency-path: fibre-sentinel/go.sum
      - name: vet
        working-directory: fibre-sentinel
        run: go vet ./...
      - name: build all commands
        working-directory: fibre-sentinel
        run: go build ./...
      - name: test
        working-directory: fibre-sentinel
        # The day partials' equality harness drives the collector pass by
        # pass; the api package takes minutes, more on a loaded runner, so
        # the default ten-minute timeout is no margin.
        run: go test -timeout 30m -shuffle=on ./...

  # ---- devnet + test scripts ----
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax)
        run: for f in fibre-devnet/*.sh fibre-sentinel/*.sh deploy/test/*.sh; do bash -n "$f"; done
      - name: python syntax (deploy helpers)
        run: for f in deploy/*.py deploy/test/*.py; do python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; done
      - name: shellcheck (errors only)
        run: shellcheck --severity=error fibre-devnet/*.sh fibre-sentinel/*.sh deploy/*.sh deploy/test/*.sh
      - name: acceptance-test self-test
        run: deploy/test/selftest.sh

  # ---- the dashboard: static Next.js export ----
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: build (static export)
        working-directory: web
        run: npm run build
