# Sampling master secret for mocha-5. Nothing is sampled any more: every
# blob is read the way celestia-app's Fibre client reads it. The secret
# stays only so the day secrets of the draws made while publications were
# sampled can still be revealed (sampling-secrets.jsonl) and audited; once
# the last such day is revealed, it can be deleted.
sampling:
  # master_secret_file: left unset, so sentinel-probe puts it at
  # <data-dir>/sampling-master.key, the only path the unit can write
  # (fibre-probe@.service runs ProtectSystem=strict with
  # ReadWritePaths=/var/lib/fibre-observer/%i).
  # master_secret_file: ""
